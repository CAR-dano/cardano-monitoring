services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: cardano-monitoring-proxy
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
