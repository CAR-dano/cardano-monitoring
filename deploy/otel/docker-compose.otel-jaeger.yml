services:
  jaeger:
    image: jaegertracing/jaeger:2.0.0
    container_name: cardano-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '16686:16686'
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:16686 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.1
    container_name: cardano-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '13133:13133'
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:13133 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
