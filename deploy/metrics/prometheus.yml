global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: cardano-backend
    scheme: http
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['cardano-backend:3010']
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_bearer_token
