global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default-stdout
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-stdout

receivers:
  - name: default-stdout
    webhook_configs:
      - url: http://127.0.0.1:5001/
        send_resolved: true

  - name: critical-stdout
    webhook_configs:
      - url: http://127.0.0.1:5001/critical
        send_resolved: true
